name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust (wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: "latest"

      # trunk scarica da solo tailwindcss v4.3.3 (vedi Trunk.toml)
      # public_url "/" = user pages (repo rinominato in <utente>.github.io),
      # così il sito è servito direttamente su ciroburro.github.io
      - name: Build (release, user pages)
        run: trunk build --release --public-url /

      # SPA fallback: GitHub Pages serve 404.html per le route profonde,
      # la SPA si monta e il router history mostra la pagina giusta.
      - name: Prepare SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
